<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#c8692f"/>
      <stop offset="0.55" stop-color="#8a3a1c"/>
      <stop offset="1" stop-color="#3a1a0c"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5652f"/>
      <stop offset="0.5" stop-color="#7d4520"/>
      <stop offset="1" stop-color="#5a2f14"/>
    </linearGradient>
    <pattern id="grain" width="1024" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 Q256 3 512 9 T1024 9" stroke="#4a2410" stroke-opacity="0.22" stroke-width="2" fill="none"/>
    </pattern>
    <radialGradient id="pit" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#3a1e0d"/>
      <stop offset="0.7" stop-color="#5c3216"/>
      <stop offset="1" stop-color="#c08a52"/>
    </radialGradient>
    <radialGradient id="seedA" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff3d8"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4a14"/>
    </radialGradient>
    <radialGradient id="seedB" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f4e9d8"/>
      <stop offset="0.45" stop-color="#8a5a3a"/>
      <stop offset="1" stop-color="#3a2014"/>
    </radialGradient>
    <radialGradient id="seedC" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e6fff4"/>
      <stop offset="0.45" stop-color="#5fae8c"/>
      <stop offset="1" stop-color="#1f4a3a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a6"/>
      <stop offset="0.55" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b07a22"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- capulana-style zig-zag borders -->
  <g fill="#f2c14e" opacity="0.9">
    <path d="M0 60 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 V72 H0Z" opacity="0.55"/>
    <path d="M0 964 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 l32 28 l32 -28 V952 H0Z" opacity="0.55"/>
  </g>

  <!-- board -->
  <g filter="url(#shadow)">
    <rect x="132" y="178" width="760" height="560" rx="70" fill="url(#wood)"/>
    <rect x="132" y="178" width="760" height="560" rx="70" fill="url(#grain)"/>
    <rect x="146" y="192" width="732" height="532" rx="58" fill="none" stroke="#ffd79a" stroke-opacity="0.25" stroke-width="4"/>
    <!-- centre divider -->
    <path d="M190 458 H834" stroke="#3a1a0c" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="18 14"/>
  </g>

  <!-- 4 x 4 bins -->
  <g id="bins">
    <g transform="translate(232 268)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(418 268)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(606 268)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(792 268)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(232 386)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(418 386)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(606 386)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(792 386)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(232 530)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(418 530)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(606 530)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(792 530)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(232 648)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(418 648)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(606 648)"><circle r="58" fill="url(#pit)"/></g>
    <g transform="translate(792 648)"><circle r="58" fill="url(#pit)"/></g>
  </g>

  <!-- seeds -->
  <g filter="url(#soft)">
    <ellipse cx="218" cy="262" rx="17" ry="14" fill="url(#seedB)"/><ellipse cx="248" cy="276" rx="17" ry="14" fill="url(#seedA)"/>
    <ellipse cx="404" cy="274" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="434" cy="262" rx="17" ry="14" fill="url(#seedC)"/>
    <ellipse cx="606" cy="268" rx="17" ry="14" fill="url(#seedB)"/>
    <ellipse cx="778" cy="262" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="806" cy="276" rx="17" ry="14" fill="url(#seedB)"/>
    <ellipse cx="220" cy="392" rx="17" ry="14" fill="url(#seedC)"/><ellipse cx="246" cy="378" rx="17" ry="14" fill="url(#seedA)"/>
    <ellipse cx="406" cy="380" rx="17" ry="14" fill="url(#seedB)"/><ellipse cx="432" cy="394" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="420" cy="368" rx="15" ry="12" fill="url(#seedC)"/>
    <ellipse cx="792" cy="386" rx="17" ry="14" fill="url(#seedA)"/>
    <ellipse cx="232" cy="530" rx="17" ry="14" fill="url(#seedB)"/>
    <ellipse cx="404" cy="524" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="432" cy="538" rx="17" ry="14" fill="url(#seedB)"/>
    <ellipse cx="592" cy="538" rx="17" ry="14" fill="url(#seedC)"/><ellipse cx="620" cy="524" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="606" cy="550" rx="15" ry="12" fill="url(#seedB)"/>
    <ellipse cx="778" cy="536" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="806" cy="522" rx="17" ry="14" fill="url(#seedC)"/>
    <ellipse cx="218" cy="654" rx="17" ry="14" fill="url(#seedA)"/><ellipse cx="246" cy="640" rx="17" ry="14" fill="url(#seedB)"/>
    <ellipse cx="606" cy="648" rx="17" ry="14" fill="url(#seedA)"/>
    <ellipse cx="778" cy="642" rx="17" ry="14" fill="url(#seedB)"/><ellipse cx="806" cy="656" rx="17" ry="14" fill="url(#seedA)"/>
  </g>
  <!-- a seed in flight, sowing anti-clockwise -->
  <path d="M470 690 Q520 770 590 712" stroke="#ffe7a6" stroke-opacity="0.65" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
  <ellipse cx="452" cy="672" rx="19" ry="16" fill="url(#seedA)" filter="url(#soft)"/>

  <!-- title -->
  <text x="512" y="878" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="132" letter-spacing="10" fill="url(#gold)" stroke="#3a1a0c" stroke-width="5" paint-order="stroke" filter="url(#soft)">NTXUVA</text>
</svg>
